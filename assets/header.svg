<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Shubham Yawalkar. I shape and build AI products, end to end." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Shubham Yawalkar — I shape and build AI products, end to end.</title>
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#FFC53D" fill-opacity="0.18"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFC53D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFC53D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" cx="35%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0D0B07" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="topline" x1="0" x2="1">
      <stop offset="0" stop-color="#FFC53D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFC53D" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFC53D" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', 'Poppins', 'Helvetica Neue', Arial, sans-serif; }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.22,1,.36,1) forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .6s; } .d4 { animation-delay: .85s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .draw { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 1.2s 1.1s ease-in-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .pulse { animation: pulse 5s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    .float { animation: float 6s ease-in-out infinite; }
    .float2 { animation: float 8s ease-in-out infinite 1.2s; }
    .float3 { animation: float 7s ease-in-out infinite .6s; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .spin { animation: spin 26s linear infinite; transform-origin: 960px 170px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .rise, .draw, .pulse, .float, .float2, .float3, .spin, .blink { animation: none !important; opacity: 1 !important; stroke-dashoffset: 0 !important; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="#0D0B07"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <rect width="1200" height="340" fill="url(#fade)"/>
    <circle class="pulse" cx="960" cy="170" r="190" fill="url(#glow)"/>
    <rect x="0" y="0" width="1200" height="2" fill="url(#topline)"/>

    <!-- Left: text -->
    <g class="sans">
      <text class="rise d1" x="72" y="96" font-size="22" fill="#F7F4EE">Hello! I'm <tspan fill="#FFC53D" font-weight="700">Shubham Yawalkar</tspan></text>
      <text class="rise d2" x="70" y="160" font-size="30" fill="#ABA396">I shape and build</text>
      <text class="rise d3" x="68" y="222" font-size="60" font-weight="800" fill="#F7F4EE" letter-spacing="-1.5">AI products,</text>
      <text class="rise d4" x="68" y="288" font-size="60" font-weight="800" fill="#FFC53D" letter-spacing="-1.5">end to end.<tspan class="blink" fill="#FFC53D">|</tspan></text>
      <path class="draw" d="M70 306 C 160 292, 260 290, 340 298 S 430 308, 470 296" fill="none" stroke="#FFC53D" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Right: orbit + doodles -->
    <g class="spin">
      <circle cx="960" cy="170" r="120" fill="none" stroke="#FFC53D" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="3 9"/>
      <circle cx="960" cy="50" r="5" fill="#FFC53D"/>
      <circle cx="1080" cy="170" r="3" fill="#FDE68A"/>
    </g>
    <circle cx="960" cy="170" r="70" fill="#15120B" stroke="#FFC53D" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="960" y="186" text-anchor="middle" class="sans" font-size="44" font-weight="800" fill="#FFC53D">SY</text>

    <!-- bulb -->
    <g class="float" fill="none" stroke="#FFC53D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M818 78a20 20 0 0 0-12 36c2.3 1.7 3.6 4.3 3.6 7.1v3.3h16.8v-3.3c0-2.8 1.3-5.4 3.6-7.1A20 20 0 0 0 818 78Z"/>
      <path d="M811 132h14M813 139h10"/>
    </g>
    <!-- code brackets -->
    <g class="float2" fill="none" stroke="#FDE68A" stroke-opacity="0.85" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1100 84l-14 14 14 14M1128 84l14 14-14 14M1120 78l-10 40"/>
    </g>
    <!-- chart -->
    <g class="float3" fill="none" stroke="#FFC53D" stroke-opacity="0.8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M800 266h52M806 254l12-14 12 9 16-22M838 227h10v10"/>
    </g>
    <!-- sparkle -->
    <g class="float" fill="none" stroke="#FFC53D" stroke-width="2" stroke-linecap="round">
      <path d="M1112 252v18M1103 261h18M1105 254l14 14M1119 254l-14 14"/>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="21.5" fill="none" stroke="#2B251A" stroke-width="1.5"/>
</svg>
