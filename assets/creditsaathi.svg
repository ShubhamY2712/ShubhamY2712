<svg xmlns="http://www.w3.org/2000/svg" width="580" height="290" viewBox="0 0 580 290" role="img" aria-label="CreditSaathi: AI-driven alternative credit scoring. Team Lead (4-member team)  ·  August 2026 – Present. In progress." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>CreditSaathi — AI-driven alternative credit scoring (in progress)</title>
  <defs>
    <linearGradient id="sweep" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#FFC53D" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFC53D" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFC53D" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="g" cx="85%" cy="15%" r="60%">
      <stop offset="0" stop-color="#FFC53D" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FFC53D" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><rect x="1" y="1" width="578" height="288" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', 'Poppins', 'Helvetica Neue', Arial, sans-serif; }
    .sweep { animation: sweep 4.5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-300px); } 100% { transform: translateX(600px); } }
    .dot { animation: dot 1.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes dot { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
    .ring { animation: ring 1.6s ease-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes ring { from { opacity: .7; transform: scale(1); } to { opacity: 0; transform: scale(2.6); } }
    .bob { animation: bob 5s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.22,1,.36,1) forwards; }
    .r2 { animation-delay: .15s; } .r3 { animation-delay: .3s; } .r4 { animation-delay: .45s; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .sweep, .dot, .ring, .bob, .rise { animation: none !important; opacity: 1 !important; } .sweep { opacity: 0 !important; } }
  </style>
  <g clip-path="url(#c)">
    <rect width="580" height="290" fill="#15120B"/>
    <rect width="580" height="290" fill="url(#g)"/>
    <rect class="sweep" x="0" y="0" width="300" height="2" fill="url(#sweep)"/>
  </g>
  <rect x="1" y="1" width="578" height="288" rx="20" fill="none" stroke="#2B251A" stroke-width="1.5"/>
  <g class="bob" transform="translate(0,0)"><g transform="translate(496,170)" fill="none" stroke="#FFC53D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".55"><path d="M22 2 L42 10 V24 C42 36 33 44 22 48 C11 44 2 36 2 24 V10 Z"/><path d="M13 25 L20 32 L32 18"/></g></g>
  <g class="rise">
    <text x="32" y="64" class="sans" font-size="34" font-weight="800" fill="#F7F4EE">CreditSaathi</text>
  </g>
  <g class="rise r2">
    <text x="32" y="94" class="sans" font-size="16" font-weight="600" fill="#FFC53D">AI-driven alternative credit scoring</text>
    <text x="32" y="122" class="sans" font-size="13.5" fill="#ABA396">Team Lead (4-member team)  ·  August 2026 – Present</text>
  </g>
  <g class="rise r3"><text x="32" y="170" class="sans" font-size="15" fill="#ABA396">Credit scoring for gig workers and MSMEs,</text><text x="32" y="192" class="sans" font-size="15" fill="#ABA396">with a built-in fairness audit.</text></g>
  <g class="rise r4"><g><rect x="32" y="232" width="70" height="28" rx="14" fill="#2A2110" stroke="#FFC53D" stroke-opacity=".35"/><text x="67.0" y="250.5" text-anchor="middle" class="sans" font-size="12.5" font-weight="600" fill="#FDE68A">Python</text></g><g><rect x="110" y="232" width="144" height="28" rx="14" fill="#2A2110" stroke="#FFC53D" stroke-opacity=".35"/><text x="182.0" y="250.5" text-anchor="middle" class="sans" font-size="12.5" font-weight="600" fill="#FDE68A">Machine Learning</text></g><g><rect x="262" y="232" width="151" height="28" rx="14" fill="#2A2110" stroke="#FFC53D" stroke-opacity=".35"/><text x="337.5" y="250.5" text-anchor="middle" class="sans" font-size="12.5" font-weight="600" fill="#FDE68A">Transfer Learning</text></g></g>
  <g transform="translate(430,30)">
    <rect width="124" height="28" rx="14" fill="#3D2C05" stroke="#FFC53D" stroke-opacity=".5"/>
    <circle class="ring" cx="18" cy="14" r="4.5" fill="none" stroke="#FFC53D" stroke-width="1.5"/>
    <circle class="dot" cx="18" cy="14" r="4.5" fill="#FFC53D"/>
    <text x="30" y="18.5" class="sans" font-size="11.5" font-weight="700" letter-spacing=".08em" fill="#FDE68A">IN PROGRESS</text>
  </g>
</svg>
