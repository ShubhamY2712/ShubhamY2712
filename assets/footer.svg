<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Open to AI Product Manager, Business Analyst and technical AI/ML internships and roles." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .sans { font-family: 'Segoe UI', 'Poppins', 'Helvetica Neue', Arial, sans-serif; }
    .trail { stroke-dasharray: 4 9; animation: dash 3s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -26; } }
    .plane { animation: fly 5s ease-in-out infinite; }
    @keyframes fly { 0%,100% { transform: translate(0,0) rotate(0); } 50% { transform: translate(8px,-8px) rotate(-4deg); } }
    @media (prefers-reduced-motion: reduce) { .trail, .plane { animation: none; } }
  </style>
  <rect width="1200" height="150" rx="20" fill="#0D0B07"/>
  <rect x="0.75" y="0.75" width="1198.5" height="148.5" rx="19.5" fill="none" stroke="#2B251A" stroke-width="1.5"/>
  <path class="trail" d="M60 118 C 160 128, 220 70, 300 84 S 380 120, 430 92" fill="none" stroke="#FFC53D" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <g class="plane" fill="none" stroke="#FFC53D" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M430 90 476 60 460 112 446 98Z"/><path d="M476 60 446 98l-2 20 12-14"/>
  </g>
  <text x="560" y="72" class="sans" font-size="30" font-weight="800" fill="#F7F4EE">Let's <tspan fill="#FFC53D">talk</tspan></text>
  <text x="560" y="106" class="sans" font-size="17" fill="#ABA396">Open to AI Product Manager, Business Analyst</text>
  <text x="560" y="128" class="sans" font-size="17" fill="#ABA396">and technical AI/ML internships and roles.</text>
</svg>
