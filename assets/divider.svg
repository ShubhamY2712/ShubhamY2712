<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .draw { stroke-dasharray: 1300; stroke-dashoffset: 1300; animation: draw 2.4s ease-in-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .dot { animation: move 6s ease-in-out infinite alternate; }
    @keyframes move { from { transform: translateX(0); } to { transform: translateX(1100px); } }
    @media (prefers-reduced-motion: reduce) { .draw, .dot { animation: none; stroke-dashoffset: 0; } }
  </style>
  <path class="draw" d="M10 14 C 110 4, 210 24, 310 14 S 510 4, 610 14 S 810 24, 910 14 S 1110 4, 1190 14" fill="none" stroke="#FFC53D" stroke-opacity="0.75" stroke-width="2" stroke-linecap="round"/>
  <circle class="dot" cx="50" cy="14" r="4" fill="#FFC53D"/>
</svg>
