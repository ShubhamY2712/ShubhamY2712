# Builds the animated, amber-themed images used in README.md:
#   - stats.svg and activity.svg (from scripts/profile_cards.py, using GitHub's own API)
#   - github-snake.svg and github-snake-dark.svg (the snake eating the contribution graph)
# and publishes them to the "output" branch.
# Runs every 12 hours, on every push to main, and on demand (Actions tab -> Profile cards -> Run workflow).
name: Profile cards

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the profile repo
        uses: actions/checkout@v4

      - name: Build the stats card and activity graph
        run: python3 scripts/profile_cards.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Build the snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=B7791F&color_dots=#ebedf0,#FDE68A,#FFC53D,#E0A82E,#B7791F
            dist/github-snake-dark.svg?color_snake=FFC53D&color_dots=#161B22,#3D2C05,#7A5A12,#B7791F,#FFC53D

      - name: Publish everything to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
