# Draws the amber "snake eating my contributions" animation used in README.md.
# Runs every 12 hours, on every push to main, and on demand (Actions tab -> Snake -> Run workflow).
name: Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=B7791F&color_dots=#ebedf0,#FDE68A,#FFC53D,#E0A82E,#B7791F
            dist/github-snake-dark.svg?color_snake=FFC53D&color_dots=#161B22,#3D2C05,#7A5A12,#B7791F,#FFC53D

      - name: Publish them to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
